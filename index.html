<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    const lang = (navigator.language || '').toLowerCase();

    window.location.replace(
      lang.startsWith('ja')
        ? './wordpress/p987.html'
        : './wordpress/p6105.html'
    );
  </script>
</head>
<body>
  <p>
    <a href="./wordpress/p987.html">日本語</a> /
    <a href="./wordpress/p6105.html">English</a>
  </p>
</body>
</html>
